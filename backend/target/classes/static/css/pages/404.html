<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - FreelanceHub</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eef2ff 0%, #f0fdf4 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px;
        }
        .error-container {
            text-align: center;
            max-width: 480px;
        }
        .error-code {
            font-size: clamp(80px, 18vw, 140px);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .error-icon  { font-size: 56px; margin-bottom: 16px; display: block; }
        .error-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--gray-900);
            margin-bottom: 12px;
        }
        .error-desc {
            font-size: 15px;
            color: var(--gray-500);
            line-height: 1.7;
            margin-bottom: 32px;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <span class="error-icon">🔍</span>
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-desc">
            The page you're looking for doesn't exist or has been moved.<br>
            Head back to the dashboard or start fresh from the homepage.
        </p>
        <div class="error-actions">
            <a href="../index.html" class="btn btn-primary">⚡ Go to Homepage</a>
            <button class="btn btn-outline" onclick="history.back()">← Go Back</button>
        </div>
    </div>
    <script>
        // Auto-redirect if user has a session — send them to their dashboard
        const role = sessionStorage.getItem('role');
        const token = sessionStorage.getItem('token');
        if (token && role) {
            const dashboardLink = document.querySelector('.error-actions');
            const dash = document.createElement('a');
            dash.className = 'btn btn-outline';
            dash.href = role === 'CLIENT' ? 'client-dashboard.html' : 'freelancer-dashboard.html';
            dash.textContent = '📊 My Dashboard';
            dashboardLink.prepend(dash);
        }
    </script>
</body>
</html>
