# ============================================================
# Freelancer Hiring Platform - Application Configuration
# ============================================================

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/freelancer_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Vvt@907856#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=FreelancerPlatformSecretKey2024VeryLongSecretKeyForJWTSigning
jwt.expiration=86400000

# CORS
cors.allowed-origins=*

# Admin email used to authorize the startup-seeded administrator.
app.admin.email=rajshri@admin.com
app.admin.password=${APP_ADMIN_PASSWORD:}

# Jackson - serialize dates as ISO strings, not timestamps
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.com.freelancer=DEBUG
logging.level.org.springframework.security=INFO
