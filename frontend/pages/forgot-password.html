<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - FreelanceHub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-brand">
            <a href="../index.html">
                <span class="brand-icon">⚡</span>
                <span class="brand-name">FreelanceHub</span>
            </a>
        </div>

        <div class="auth-card">
            <h2>Reset Your Password</h2>
            <p class="auth-subtitle">Enter your account email and choose a new password</p>

            <div id="alert-box" class="alert hidden" role="status" aria-live="polite"></div>

            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com"
                           required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword"
                           placeholder="At least 6 characters" required minlength="6"
                           autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                           placeholder="Re-enter your new password" required minlength="6"
                           autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="resetPasswordBtn">
                    <span id="resetPasswordBtnText">Update Password</span>
                    <span id="resetPasswordSpinner" class="spinner hidden"></span>
                </button>
            </form>

            <p class="auth-switch">
                Remembered your password? <a href="login.html">Sign in</a>
            </p>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        const form = document.getElementById('resetPasswordForm');
        const alertBox = document.getElementById('alert-box');

        function showResetAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert ${type}`;
            alertBox.classList.remove('hidden');
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const button = document.getElementById('resetPasswordBtn');
            const buttonText = document.getElementById('resetPasswordBtnText');
            const spinner = document.getElementById('resetPasswordSpinner');

            if (newPassword.length < 6) {
                showResetAlert('Your password must be at least 6 characters long.', 'error');
                return;
            }
            if (newPassword !== confirmPassword) {
                showResetAlert('The passwords do not match.', 'error');
                return;
            }

            button.disabled = true;
            buttonText.style.opacity = '0.5';
            spinner.classList.remove('hidden');
            alertBox.classList.add('hidden');

            try {
                const response = await fetch(`${API_BASE}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, newPassword })
                });
                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || result.message || 'Unable to update your password.');
                }

                showResetAlert(result.message || 'Password updated successfully. You can now sign in.', 'success');
                form.reset();
            } catch (error) {
                showResetAlert(error.message || 'Unable to update your password. Please try again.', 'error');
            } finally {
                button.disabled = false;
                buttonText.style.opacity = '1';
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
